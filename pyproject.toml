[project]
name = "physicsx-demo"
version = "0.1.0"
description = "W&B workshop for PhysicsX — multi-stage surrogate modeling with runs, sweeps, artifacts, registry, and reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "wandb>=0.18",
    "wandb-workspaces>=0.2",
    "torch>=2.4",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
]

[project.optional-dependencies]
airfrans = ["airfrans>=0.1"]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physicsx_demo"]
