<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Weights and Biases lineage and outputs</title>
  <desc id="desc">A refined W&amp;B lineage diagram showing dataset artifacts, training runs, sweep checkpoint candidates, promotion into Models Registry, Reports, and Workspace outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .title { fill: #0f172a; font-size: 34px; font-weight: 850; }
      .subtitle { fill: #64748b; font-size: 17px; }
      .h { fill: #0f172a; font-size: 18px; font-weight: 850; }
      .p { fill: #64748b; font-size: 13px; }
      .tag { fill: #334155; font-size: 12px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1280" height="620" rx="30" fill="url(#bg)"/>
  <g class="font" transform="translate(56 54)">
    <text class="title" x="0" y="0">W&amp;B Models and artifact lineage</text>
    <text class="subtitle" x="0" y="32">Sweep trials create checkpoint candidates; the promotion run links the winner into Models Registry for downstream use.</text>
  </g>

  <g transform="translate(58 138)">
    <path d="M178 105 H286" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M478 105 H586" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M778 105 H884" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M695 132 V260 H420 V292" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".72"/>
    <path d="M1017 132 V260 H725 V292" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".72"/>
    <path d="M540 344 H586" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" opacity=".86"/>
    <path d="M850 344 H886" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" opacity=".86"/>

    <g class="font" filter="url(#shadow)">
      <g>
        <rect width="190" height="132" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="20" y="20" width="42" height="42" rx="12" fill="#dcfce7"/>
        <path d="M29 44 C40 29 54 33 57 46 C48 41 39 48 29 44 Z" fill="#16a34a"/>
        <text class="h" x="20" y="88">Dataset</text>
        <text class="p" x="20" y="111">datasets:production</text>
      </g>

      <g transform="translate(300 0)">
        <rect width="190" height="132" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="20" y="20" width="42" height="42" rx="12" fill="#dbeafe"/>
        <path d="M30 51 L41 28 L52 51 Z" fill="#2563eb"/>
        <text class="h" x="20" y="88">Train run</text>
        <text class="p" x="20" y="111">metrics + media</text>
      </g>

      <g transform="translate(600 0)">
        <rect width="190" height="132" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="20" y="20" width="42" height="42" rx="12" fill="#fef3c7"/>
        <path d="M29 31 H55 V55 H29 Z" fill="#f59e0b"/>
        <path d="M34 38 H50 M34 45 H50 M34 52 H44" stroke="#fff7ed" stroke-width="2"/>
        <text class="h" x="20" y="88">Checkpoint</text>
        <text class="p" x="20" y="111">checkpoints:prod</text>
      </g>

      <g transform="translate(900 0)">
        <rect width="234" height="132" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="20" y="20" width="42" height="42" rx="12" fill="#ede9fe"/>
        <path d="M31 52 C35 32 48 30 54 50" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
        <text class="h" x="20" y="88">W&amp;B Models</text>
        <text class="p" x="20" y="111">tuned:production</text>
      </g>

      <g transform="translate(300 292)">
        <rect width="240" height="104" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="h" x="22" y="36">Sweeps</text>
        <text class="p" x="22" y="58">checkpoint candidates</text>
        <rect x="22" y="76" width="112" height="10" rx="5" fill="#dbeafe"/>
        <rect x="144" y="76" width="58" height="10" rx="5" fill="#bfdbfe"/>
      </g>

      <g transform="translate(600 292)">
        <rect width="250" height="104" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="h" x="22" y="36">Promotion run</text>
        <text class="p" x="22" y="58">links best checkpoint</text>
        <rect x="22" y="76" width="176" height="10" rx="5" fill="#ccfbf1"/>
      </g>

      <g transform="translate(900 292)">
        <rect width="234" height="104" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="h" x="22" y="36">Report + Workspace</text>
        <text class="p" x="22" y="58">consume Registry alias</text>
        <rect x="22" y="76" width="64" height="10" rx="5" fill="#fef3c7"/>
        <rect x="96" y="76" width="82" height="10" rx="5" fill="#fde68a"/>
      </g>
    </g>
  </g>

  <g class="font" transform="translate(58 560)">
    <rect width="796" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="tag" x="22" y="22">Artifacts</text>
    <text class="tag" x="110" y="22">Registry aliases</text>
    <text class="tag" x="250" y="22">Tables</text>
    <text class="tag" x="330" y="22">Images</text>
    <text class="tag" x="412" y="22">Videos</text>
    <text class="tag" x="498" y="22">Reports</text>
    <text class="tag" x="594" y="22">Workspace views</text>
  </g>
</svg>
