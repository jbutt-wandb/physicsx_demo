<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">TinyTransolver architecture</title>
  <desc id="desc">A refined architecture diagram showing HiLift design tokens, learned physics slices, slice-level attention, pooling, and coefficient outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="blueTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".45" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .title { fill: #0f172a; font-size: 34px; font-weight: 850; }
      .subtitle { fill: #64748b; font-size: 17px; }
      .h { fill: #0f172a; font-size: 18px; font-weight: 850; }
      .p { fill: #64748b; font-size: 13px; }
      .code { fill: #334155; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="30" fill="url(#bg)"/>
  <g class="font" transform="translate(54 54)">
    <text class="title" x="0" y="0">TinyTransolverKpi model path</text>
    <text class="subtitle" x="0" y="32">A small Physics-Attention surrogate that turns high-lift design tokens into CL/CD/CM predictions.</text>
  </g>

  <g transform="translate(54 126)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="214" height="296" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="font h" x="24" y="40">Input tokens</text>
      <text class="font p" x="24" y="66">8 design tokens + AoA</text>
      <text class="font code" x="24" y="95">(feature, station, value)</text>
      <rect x="24" y="122" width="166" height="108" rx="18" fill="#e0f2fe"/>
      <path d="M42 176 C76 142 132 146 174 166 C186 172 194 176 204 169 C184 193 146 200 92 192 C66 188 50 180 42 176 Z" fill="url(#field)"/>
      <path d="M42 176 C76 142 132 146 174 166 C186 172 194 176 204 169 M42 176 C92 194 150 199 204 169" fill="none" stroke="#082f49" stroke-width="2"/>
      <g fill="#0f766e" opacity=".45">
        <circle cx="56" cy="136" r="3"/><circle cx="78" cy="222" r="3"/><circle cx="118" cy="132" r="3"/><circle cx="158" cy="224" r="3"/><circle cx="184" cy="140" r="3"/>
      </g>
      <text class="font p" x="24" y="260">Flap/slat geometry tokens</text>
    </g>

    <path d="M235 148 H308" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)" transform="translate(324 0)">
      <rect width="222" height="296" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="font h" x="24" y="40">Slice</text>
      <text class="font p" x="24" y="66">soft assignment to M tokens</text>
      <g transform="translate(27 106)">
        <rect x="0" y="0" width="72" height="52" rx="14" fill="#dbeafe" stroke="#2563eb"/>
        <rect x="94" y="0" width="72" height="52" rx="14" fill="#ccfbf1" stroke="#14b8a6"/>
        <rect x="0" y="72" width="72" height="52" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
        <rect x="94" y="72" width="72" height="52" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
        <circle cx="36" cy="26" r="8" fill="#2563eb"/>
        <circle cx="130" cy="26" r="8" fill="#14b8a6"/>
        <circle cx="36" cy="98" r="8" fill="#f59e0b"/>
        <circle cx="130" cy="98" r="8" fill="#7c3aed"/>
      </g>
      <text class="font code" x="24" y="254">w = softmax(Wx)</text>
    </g>

    <path d="M570 148 H642" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)" transform="translate(658 0)">
      <rect width="224" height="296" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="font h" x="24" y="40">Attend</text>
      <text class="font p" x="24" y="66">slice-level global context</text>
      <g transform="translate(58 112)" stroke-linecap="round">
        <circle cx="24" cy="24" r="15" fill="#2563eb"/>
        <circle cx="118" cy="24" r="15" fill="#14b8a6"/>
        <circle cx="24" cy="116" r="15" fill="#f59e0b"/>
        <circle cx="118" cy="116" r="15" fill="#7c3aed"/>
        <path d="M42 27 C62 42 80 42 100 27" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <path d="M28 43 C44 66 44 82 28 98" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <path d="M42 108 C62 92 80 92 100 108" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <path d="M114 43 C96 68 96 82 114 98" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <path d="M42 42 C68 68 80 80 100 100" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      </g>
      <text class="font code" x="24" y="254">Attn(Q, K, V) over M</text>
    </g>

    <path d="M906 148 H978" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)" transform="translate(994 0)">
      <rect width="214" height="296" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="font h" x="24" y="40">Pool + head</text>
      <text class="font p" x="24" y="66">aggregate slice context</text>
      <rect x="24" y="104" width="166" height="118" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="42" y="126" width="130" height="18" rx="9" fill="#dbeafe"/>
      <rect x="42" y="158" width="92" height="18" rx="9" fill="#ccfbf1"/>
      <rect x="42" y="190" width="116" height="18" rx="9" fill="#fef3c7"/>
      <text class="font code" x="24" y="254">(CL, CD, CM)</text>
    </g>
  </g>

  <g class="font" transform="translate(54 486)">
    <rect x="0" y="-30" width="1172" height="104" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="8" fill="#0f172a" font-size="16" font-weight="850">Why it matters:</text>
    <text x="154" y="8" fill="#475569" font-size="16">the pooled-token MLP compresses the design variables directly.</text>
    <text x="24" y="42" fill="#475569" font-size="16">TinyTransolverKpi routes semantic flap/slat tokens through learned slices before predicting aerodynamic coefficients.</text>
  </g>
</svg>
